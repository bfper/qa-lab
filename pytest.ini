[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Fail loudly instead of skipping silently on a typo'd marker
addopts =
    --strict-markers
    --tb=short
    -ra

markers =
    unit: pure logic, no container required (week 1)
    e2e: browser test, requires the compose stack (weeks 2-3)
    api: HTTP-level test, requires the compose stack (week 5)
    data: database oracle, requires the compose stack (week 6)
    slow: takes more than a few seconds

# pytest-randomly is installed on purpose: order dependency is a bug.
# Disable only to reproduce a failure: pytest -p no:randomly
